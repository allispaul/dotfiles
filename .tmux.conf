# Change prefix key
set -g prefix C-Space
bind C-Space send-prefix

# Advertise 256 colors inside tmux (the default, "screen", has 8)
set -g default-terminal "tmux-256color"

# Override terminal so it displays 32bit RGB color
set -ag terminal-overrides ",*256col*:RGB,xterm-ghostty:RGB,xterm-kitty:RGB"

# Shortcut for reloading .tmux.conf
bind r \
    source-file ~/.tmux.conf \; \
    display-message "Configuration reloaded"

# More sensible split-window shortcuts
bind | split-window -h
bind - split-window -v

# extend repeat limit for prefix commands
set -sg repeat-time 250

# vi keys for pane movement and resizing
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi keys for window movement
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Allow mouse control
set -g mouse on
set -g focus-events on

# Minimize tmux-imposed keystroke delay
set -sg escape-time 1

# vi keyboard shortcuts for copy/paste
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 

# Colors
set -g @peach "#ebb978"
set -g @darkest_forest "#061608"
set -g @turf "#495d2d"
set -g @pesto "#526b28"
set -g @grasshopper "#64c260"
set -g @desert_locust "#a9a053"
set -g @kombucha "#dda461"
set -g @warm_sands "#e4a363"
set -g @cacao "#4a031d"
set -g @tv_glow "#001010"

set -g status-style "fg=#{@cacao},bold,bg=#{@warm_sands}"
set -g window-status-style "fg=#{@cacao},bg=#{@warm_sands}"
set -g window-status-current-style "fg=#{@cacao},italics,bg=#{@grasshopper}"
set -wg pane-border-style "fg=#{@warm_sands},bg=black"
set -wg pane-active-border-style "fg=black,bg=#{@warm_sands}"
set -wg pane-border-lines double
set -g pane-border-indicators arrows
set -g pane-border-status top
set -g window-style "fg=#{@pesto},bg=#{@darkest_forest}"
set -g window-active-style "fg=white,bg=#{@tv_glow}"
set -g message-style "fg=#{@cacao},bg=#{@kombucha},bold,italics"

# Set status line
set -g status-left-length 40
set -g status-left "[#(whoami)@#H:#S] "
set -g status-right-length 50
set -g status-right "#[bg=#{@desert_locust}]#(echo '#{pane_current_path}' | sed 's|$HOME|~|; s|\\([^/]*/[^/]*/\\).*\\(/[^/]*/.*\\)$|\\1 ... \\2|; s|/| > |g')#[bg=#{@warm_sands}] %R %d-%b-%y"

set -wg monitor-activity on
set -wg visual-activity on

set -sg editor /usr/bin/vim
